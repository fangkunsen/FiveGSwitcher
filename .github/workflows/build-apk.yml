name: Build debug APK

on:
  # 只允许手动运行，避免每次提交都消耗 Actions 配额
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 拉取当前 fork 的代码
      - name: Checkout
        uses: actions/checkout@v4

      # Android 项目一般可使用 JDK 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # GitHub runner 已预装 Android SDK，此步骤补充常用命令行工具
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 确保 Gradle Wrapper 可以在 Linux runner 中执行
      - name: Set Gradle permission
        run: chmod +x gradlew

      # 使用项目自带的 Gradle 版本构建 debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 无论 APK 位于 app 或其他模块，均自动收集
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
